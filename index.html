<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠忆绿洲 · 纪念堂</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family: "PingFang SC", "微软雅黑", sans-serif;
            background: linear-gradient(160deg, #f5efe9 0%, #eae2da 100%);
            min-height: 100vh;
            color: #6b5c53;
        }
        .top-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(205,190,175,0.3);
        }
        .top-bar span{
            color: #8c6d5c;
            font-size: 15px;
        }
        .pet-card{
            text-align: center;
            padding: 45px 20px 20px;
        }
        .pet-avatar{
            width: 230px;
            height: 230px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #d9c9bc;
            box-shadow: 0 10px 30px rgba(140,109,92,0.15);
        }
        .pet-name{
            font-size: 28px;
            color: #5a4940;
            margin: 20px 0 8px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .pet-time{
            font-size: 14px;
            color: #948479;
            margin-bottom: 12px;
        }
        .pet-desc{
            font-size: 16px;
            color: #b08e7c;
            line-height: 1.8;
        }
        .wrap-box{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 35px 20px;
        }
        .w-item{
            background: rgba(255,255,255,0.85);
            padding: 22px 8px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(120,95,80,0.08);
            transition: 0.3s ease;
            cursor: pointer;
        }
        .w-item:active{
            transform: scale(0.95);
            background: #f0e6dd;
        }
        .w-icon{
            font-size: 28px;
            margin-bottom: 8px;
        }
        .w-text{
            font-size: 13px;
            color: #6b5c53;
        }
        .msg-input{
            margin: 0 20px;
        }
        .msg-input input{
            width: 100%;
            padding: 17px 25px;
            border-radius: 50px;
            border: 1px solid #d9c9bc;
            background: rgba(255,255,255,0.8);
            font-size: 15px;
            outline: none;
        }
        .footer-txt{
            text-align: center;
            padding: 50px 0 30px;
            font-size: 12px;
            color: #a9988c;
            letter-spacing: 1px;
        }
        /* 高级弹窗 */
        .modal{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            display: none;
        }
        .modal-box{
            background: #fff;
            padding: 35px 45px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }
        .modal-txt{
            font-size: 17px;
            color: #5a4940;
            margin-bottom: 25px;
            line-height: 1.7;
        }
        .modal-btn{
            padding: 10px 28px;
            background: #d9c9bc;
            border: none;
            border-radius: 30px;
            color: #5a4940;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <span>← 返回</span>
    <span style="font-size:17px;font-weight:500;">宠忆绿洲</span>
    <span>⚙️</span>
</div>

<div class="pet-card">
    <img src="1.png" class="pet-avatar">
    <div class="pet-name">我的小宝贝</div>
    <div class="pet-time">温暖相伴 · 岁岁念安</div>
    <div class="pet-desc">愿你在喵星 安稳无忧 温柔长存</div>
</div>

<div class="wrap-box">
    <div class="w-item" onclick="addLight()">
        <div class="w-icon">🕯️</div>
        <div class="w-text">点亮明灯</div>
    </div>
    <div class="w-item" onclick="addIncense()">
        <div class="w-icon">🪷</div>
        <div class="w-text">静心敬香</div>
    </div>
    <div class="w-item" onclick="addFlower()">
        <div class="w-icon">🌹</div>
        <div class="w-text">敬献繁花</div>
    </div>
    <div class="w-item" onclick="addGift()">
        <div class="w-icon">🍼</div>
        <div class="w-text">供奉好物</div>
    </div>
</div>

<div class="msg-input">
    <input type="text" placeholder="轻声诉说 藏起思念...">
</div>

<div class="footer-txt">
    思念不负相遇 · 爱意从未消散
</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <div class="modal-txt" id="modalText"></div>
        <button class="modal-btn" onclick="closeModal()">知晓</button>
    </div>
</div>

<script>
    // 读取永久储存数据
    function getNum(key){
        return parseInt(localStorage.getItem(key)) || 0;
    }
    function setNum(key,val){
        localStorage.setItem(key,val);
    }

    const modal = document.getElementById('modal');
    const modalText = document.getElementById('modalText');

    // 点亮明灯
    function addLight(){
        let n = getNum('light') + 1;
        setNum('light',n);
        modalText.innerText = `🕯️\n你是第${n}位\n点亮明灯怀念的人`;
        modal.style.display = "flex";
    }
    // 静心敬香
    function addIncense(){
        let n = getNum('incense') + 1;
        setNum('incense',n);
        modalText.innerText = `🪷\n你是第${n}位\n静心敬香祭拜的人`;
        modal.style.display = "flex";
    }
    // 敬献繁花
    function addFlower(){
        let n = getNum('flower') + 1;
        setNum('flower',n);
        modalText.innerText = "🌹\n你是第"+n+"位\n敬献鲜花思念的人";
        modal.style.display = "flex";
    }
    // 供奉好物
    function addGift(){
        let n = getNum('gift') + 1;
        setNum('gift',n);
        modalText.innerText = `🍼\n你是第${n}位\n供奉祈福的人`;
        modal.style.display = "flex";
    }
    // 关闭弹窗
    function closeModal(){
        modal.style.display = "none";
    }
</script>

</body>
</html>
