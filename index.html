<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠忆绿洲 · 纪念堂</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family: "PingFang SC", "微软雅黑", sans-serif;
            background: linear-gradient(160deg, #f5efe9 0%, #eae2da 100%);
            min-height: 100vh;
            color: #6b5c53;
            padding-bottom: 80px;
        }
        .top-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(205,190,175,0.3);
        }
        .top-bar span{
            color: #8c6d5c;
            font-size: 15px;
        }
        .pet-card{
            text-align: center;
            padding: 45px 20px 20px;
        }
        .pet-avatar{
            width: 230px;
            height: 230px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #d9c9bc;
            box-shadow: 0 10px 30px rgba(140,109,92,0.15);
        }
        .pet-name{
            font-size: 28px;
            color: #5a4940;
            margin: 20px 0 8px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .pet-time{
            font-size: 14px;
            color: #948479;
            margin-bottom: 12px;
        }
        .pet-desc{
            font-size: 16px;
            color: #b08e7c;
            line-height: 1.8;
        }
        .wrap-box{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 35px 20px;
        }
        .w-item{
            background: rgba(255,255,255,0.85);
            padding: 22px 8px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(120,95,80,0.08);
            transition: 0.3s ease;
            cursor: pointer;
        }
        .w-item:active{
            transform: scale(0.95);
            background: #f0e6dd;
        }
        .w-icon{
            font-size: 28px;
            margin-bottom: 8px;
        }
        .w-text{
            font-size: 13px;
            color: #6b5c53;
        }

        /* 留言区域 */
        .msg-wrap{
            padding: 0 20px;
        }
        .send-box{
            display:flex;
            gap:10px;
            margin-bottom:25px;
        }
        .msg-input{
            flex:1;
            padding:16px 20px;
            border-radius: 30px;
            border: 1px solid #d9c9bc;
            background: rgba(255,255,255,0.8);
            font-size: 15px;
            outline: none;
        }
        .send-btn{
            padding:0 20px;
            border-radius:30px;
            border:none;
            background:#d9c9bc;
            color:#5a4940;
            cursor:pointer;
        }
        .list-title{
            font-size:15px;
            color:#8c6d5c;
            margin-bottom:15px;
            padding-left:5px;
        }
        .msg-list{
            display:flex;
            flex-direction:column;
            gap:12px;
        }
        .msg-item{
            background:rgba(255,255,255,0.75);
            padding:15px;
            border-radius:16px;
        }
        .msg-text{
            color:#5a4940;
            font-size:14px;
            line-height:1.6;
        }
        .msg-time{
            font-size:11px;
            color:#b0a296;
            margin-top:8px;
        }

        .footer-txt{
            text-align: center;
            padding: 40px 0 20px;
            font-size: 12px;
            color: #a9988c;
            letter-spacing: 1px;
        }

        /* 弹窗 */
        .modal{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            display: none;
        }
        .modal-box{
            background: #fff;
            padding: 35px 45px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.12);
        }
        .modal-txt{
            font-size: 17px;
            color: #5a4940;
            margin-bottom: 25px;
            line-height: 1.7;
        }
        .modal-btn{
            padding: 10px 28px;
            background: #d9c9bc;
            border: none;
            border-radius: 30px;
            color: #5a4940;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
    <!-- 免费云端数据库 全局共享数据 -->
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.10.1/dist/av-min.js"></script>
</head>
<body>

<div class="top-bar">
    <span>← 返回</span>
    <span style="font-size:17px;font-weight:500;">宠忆绿洲</span>
    <span>⚙️</span>
</div>

<div class="pet-card">
    <img src="1.png" class="pet-avatar">
    <div class="pet-name">我的小宝贝</div>
    <div class="pet-time">温暖相伴 · 岁岁念安</div>
    <div class="pet-desc">愿你在喵星 安稳无忧 温柔长存</div>
</div>

<div class="wrap-box">
    <div class="w-item" onclick="addLight()">
        <div class="w-icon">🕯️</div>
        <div class="w-text">点亮明灯</div>
    </div>
    <div class="w-item" onclick="addIncense()">
        <div class="w-icon">🪷</div>
        <div class="w-text">静心敬香</div>
    </div>
    <div class="w-item" onclick="addFlower()">
        <div class="w-icon">🌹</div>
        <div class="w-text">敬献繁花</div>
    </div>
    <div class="w-item" onclick="addGift()">
        <div class="w-icon">🍼</div>
        <div class="w-text">供奉好物</div>
    </div>
</div>

<!-- 公共留言区 -->
<div class="msg-wrap">
    <div class="send-box">
        <input class="msg-input" id="msgContent" placeholder="写下对宝贝的思念，全员可见...">
        <button class="send-btn" onclick="sendMsg()">发送</button>
    </div>
    <div class="list-title">🌙 大家的思念留言</div>
    <div class="msg-list" id="msgList"></div>
</div>

<div class="footer-txt">
    思念不负相遇 · 爱意从未消散
</div>

<!-- 祭拜弹窗 -->
<div class="modal" id="modal">
    <div class="modal-box">
        <div class="modal-txt" id="modalText"></div>
        <button class="modal-btn" onclick="closeModal()">知晓</button>
    </div>
</div>

<script>
// 初始化免费云端数据库
AV.init({
  appId: "vEj5Uf9k5dC2R1mZ7Hh9j9s9-MdYXbMMI",
  appKey: "8s7X9qF2cV5bN7gH3jK1pQ6rT8yA4zB",
  serverURL: "https://lc-cn-north-1.leancloud.app"
});

const modal = document.getElementById('modal');
const modalText = document.getElementById('modalText');

// ========== 全局祭拜计数 ==========
async function getCount(name){
    const query = new AV.Query('WorshipCount');
    query.equalTo('type', name);
    let res = await query.first();
    return res ? res.get('num') : 0;
}
async function saveCount(name,num){
    const query = new AV.Query('WorshipCount');
    query.equalTo('type', name);
    let data = await query.first() || new AV.Object('WorshipCount');
    data.set('type',name);
    data.set('num',num);
    await data.save();
}

async function addLight(){
    let n = await getCount('light') + 1;
    await saveCount('light',n);
    modalText.innerText = `🕯️\n你是第${n}位\n点亮明灯怀念的人`;
    modal.style.display = "flex";
}
async function addIncense(){
    let n = await getCount('incense') + 1;
    await saveCount('incense',n);
    modalText.innerText = `🪷\n你是第${n}位\n静心敬香祭拜的人`;
    modal.style.display = "flex";
}
async function addFlower(){
    let n = await getCount('flower') + 1;
    await saveCount('flower',n);
    modalText.innerText = `🌹\n你是第${n}位\n敬献鲜花思念的人`;
    modal.style.display = "flex";
}
async function addGift(){
    let n = await getCount('gift') + 1;
    await saveCount('gift',n);
    modalText.innerText = `🍼\n你是第${n}位\n供奉祈福的人`;
    modal.style.display = "flex";
}
function closeModal(){
    modal.style.display = "none";
}

// ========== 公共留言板 ==========
// 发送留言
async function sendMsg(){
    let val = document.getElementById('msgContent').value.trim();
    if(!val) return alert('请写下思念再发送');
    let Msg = new AV.Object('PetMessage');
    Msg.set('content',val);
    await Msg.save();
    document.getElementById('msgContent').value = '';
    loadMsg();
}

// 读取全部留言
async function loadMsg(){
    const query = new AV.Query('PetMessage');
    query.descending('createdAt');
    query.limit(50);
    let list = await query.find();
    let html = '';
    list.forEach(item=>{
        let time = item.createdAt.toLocaleString();
        html += `
        <div class="msg-item">
            <div class="msg-text">${item.get('content')}</div>
            <div class="msg-time">${time}</div>
        </div>
        `;
    });
    document.getElementById('msgList').innerHTML = html;
}

// 页面加载自动读取留言
window.onload = function(){
    loadMsg();
}
</script>

</body>
</html>
