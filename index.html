<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠忆绿洲 · 纪念堂</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family: "PingFang SC", "微软雅黑", sans-serif;
            background: linear-gradient(160deg, #f5efe9 0%, #eae2da 100%);
            min-height: 100vh;
            color: #6b5c53;
        }
        /* 顶部导航 毛玻璃高级感 */
        .top-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(205,190,175,0.3);
        }
        .top-bar span{
            color: #8c6d5c;
            font-size: 15px;
        }
        /* 宠物主区域 */
        .pet-card{
            text-align: center;
            padding: 45px 20px 20px;
        }
        .pet-avatar{
            width: 230px;
            height: 230px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #d9c9bc;
            box-shadow: 0 10px 30px rgba(140,109,92,0.15);
        }
        .pet-name{
            font-size: 28px;
            color: #5a4940;
            margin: 20px 0 8px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .pet-time{
            font-size: 14px;
            color: #948479;
            margin-bottom: 12px;
        }
        .pet-desc{
            font-size: 16px;
            color: #b08e7c;
            line-height: 1.8;
        }
        /* 祭拜按钮区 高级卡片 */
        .wrap-box{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 35px 20px;
        }
        .w-item{
            background: rgba(255,255,255,0.85);
            padding: 22px 8px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(120,95,80,0.08);
            transition: 0.3s ease;
        }
        .w-item:active{
            transform: scale(0.95);
            background: #f0e6dd;
        }
        .w-icon{
            font-size: 28px;
            margin-bottom: 8px;
        }
        .w-text{
            font-size: 13px;
            color: #6b5c53;
        }
        /* 留言输入 */
        .msg-input{
            margin: 0 20px;
        }
        .msg-input input{
            width: 100%;
            padding: 17px 25px;
            border-radius: 50px;
            border: 1px solid #d9c9bc;
            background: rgba(255,255,255,0.8);
            font-size: 15px;
            outline: none;
        }
        /* 底部文案 */
        .footer-txt{
            text-align: center;
            padding: 50px 0 30px;
            font-size: 12px;
            color: #a9988c;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <span>← 返回</span>
    <span style="font-size:17px;font-weight:500;">宠忆绿洲</span>
    <span>⚙️</span>
</div>

<div class="pet-card">
    <!-- 已改成 1.png -->
    <img src="1.png" class="pet-avatar">
    <div class="pet-name">我的小宝贝</div>
    <div class="pet-time">温暖相伴 · 岁岁念安</div>
    <div class="pet-desc">愿你在喵星 安稳无忧 温柔长存</div>
</div>

<div class="wrap-box">
    <div class="w-item">
        <div class="w-icon">🕯️</div>
        <div class="w-text">点亮明灯</div>
    </div>
    <div class="w-item">
        <div class="w-icon">🪷</div>
        <div class="w-text">静心敬香</div>
    </div>
    <div class="w-item">
        <div class="w-icon">🌹</div>
        <div class="w-text">敬献繁花</div>
    </div>
    <div class="w-item">
        <div class="w-icon">🍼</div>
        <div class="w-text">供奉好物</div>
    </div>
</div>

<div class="msg-input">
    <input type="text" placeholder="轻声诉说 藏起思念...">
</div>

<div class="footer-txt">
    思念不负相遇 · 爱意从未消散
</div>

</body>
</html>
