<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宠忆纪念堂</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
        body{background: linear-gradient(#f6f2ef, #f0e8e0);color:#555;min-height:100vh;}
        .header{background:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;}
        .pet-main{text-align:center;padding:30px 20px;}
        .pet-img{width:220px;height:220px;border-radius:50%;object-fit:cover;border:6px solid #d4b8a0;}
        .pet-name{font-size:26px;margin:14px 0;font-weight:bold;color:#5c4033;}
        .pet-date{font-size:14px;color:#998b86;}
        .blessing{color:#d49a89;margin:10px 0;font-size:16px;}
        .worship{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 20px;margin:30px 0;}
        .item{background:#fff;padding:18px;border-radius:16px;text-align:center;box-shadow:0 3px 10px rgba(139,90,66,0.1);}
        .item span{font-size:26px;}
        .item p{margin-top:8px;color:#5c4033;}
        .msg-section{padding:20px;}
        .msg-input{width:100%;padding:16px;border-radius:30px;border:1px solid #d4b8a0;outline:none;}
        .footer{text-align:center;padding:30px;color:#aaa;}
    </style>
</head>
<body>
<div class="header">
    <div>← 纪念堂</div>
    <div>宠忆绿洲</div>
    <div>⚙️</div>
</div>

<div class="pet-main">
    <!-- 你的猫咪照片 -->
    <img src="1.png" class="pet-img" alt="我的宝贝">
    <div class="pet-name">我的小宝贝</div>
    <div class="pet-date">陪伴我走过温暖的时光</div>
    <div class="blessing">愿你在喵星永远快乐，永远被爱</div>
</div>

<div class="worship">
    <div class="item"><span>🕯️</span><p>点长明灯</p></div>
    <div class="item"><span>🪔</span><p>敬香</p></div>
    <div class="item"><span>🌹</span><p>献花</p></div>
    <div class="item"><span>🐟</span><p>供奉零食</p></div>
</div>

<div class="msg-section">
    <input class="msg-input" placeholder="想对宝贝说的悄悄话...">
</div>

<div class="footer">思念永不落幕 · 我们永远爱你</div>
</body>
</html>
